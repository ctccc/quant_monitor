# Quant Monitor 配置。所有项都有内置默认值,不需要的段落可以删掉。

web:
  host: 127.0.0.1
  port: 8000

datasource:
  timeout: 15      # 单请求超时(秒)
  max_per_sec: 5   # 全局限速:每秒最多对外请求数
  retries: 1       # 失败重试次数

archive:
  hour: 15         # 交易日盘后自动归档触发时间(北京时间)
  minute: 10

# AI 参谋(可选)。支持一切 OpenAI 兼容端点:
#   DeepSeek: base_url: https://api.deepseek.com      model: deepseek-chat
#   Qwen:     base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
#             model: qwen-plus
#
# ⚠️ api_key 不要写在本文件(本文件在公开 git 仓库里)!
# 在项目根目录新建 config.local.yaml(已被 gitignore),内容示例:
#   llm:
#     enabled: true
#     api_key: "sk-你的密钥"
llm:
  enabled: false
  base_url: https://api.deepseek.com
  model: deepseek-chat
  api_key: ""
