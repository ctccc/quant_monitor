<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quant Monitor · 盯盘工作站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  /* 深色单主题:盯盘工具刻意只做黑底。配色经 dataviz 校验(dark surface #1a1a19):
     涨=红 #e66767 跌=绿 #199e70,CVD 分辨度处于临界带,故涨跌一律附 ▲/▼ 箭头冗余编码 */
  :root {
    color-scheme: dark;
    --bg:            #111110;
    --surface-1:     #1a1a19;
    --border:        #2c2c2a;
    --text-primary:  #ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:    #8a897f;
    --up:            #e66767;  /* A股约定:涨=红 */
    --down:          #199e70;  /* A股约定:跌=绿 */
    --accent:        #3987e5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 18px; font-weight: 600; }
  h1 small { color: var(--text-muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  #archive-btn {
    margin-left: auto;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  #archive-btn:hover { border-color: var(--accent); }
  #archive-btn:disabled { color: var(--text-muted); cursor: wait; }
  #msg { font-size: 12px; color: var(--text-muted); }
  #msg.err { color: var(--up); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .tile .label { font-size: 12px; color: var(--text-secondary); }
  .tile .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .value small { font-size: 12px; color: var(--text-muted); font-weight: 400; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 900px) { .grid.cols-2 { grid-template-columns: 1fr 1fr; } }
  section { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
  section h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  section h2 small { color: var(--text-muted); font-weight: 400; margin-left: 8px; }

  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th, td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 400; font-size: 12px; }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  tbody tr:hover { background: rgba(255,255,255,0.04); }
  td .sub { color: var(--text-muted); font-size: 12px; margin-left: 6px; }
  .up   { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--text-secondary); }
  .boards-badge {
    display: inline-block; min-width: 34px; text-align: center;
    border: 1px solid var(--border); border-radius: 4px;
    padding: 0 5px; font-size: 12px; color: var(--text-secondary);
  }
  .boards-hot { border-color: var(--up); color: var(--up); }
  .empty { color: var(--text-muted); padding: 18px 4px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>Quant Monitor <small id="meta">M0 地基</small></h1>
  <span id="msg"></span>
  <button id="archive-btn">立即归档今日数据</button>
</header>

<div class="tiles" id="tiles"></div>

<section>
  <h2>涨停池 <small id="zt-date"></small></h2>
  <div class="tbl-wrap"><table id="zt-tbl">
    <thead><tr>
      <th class="l">代码</th><th class="l">名称</th><th class="l">行业</th>
      <th>现价</th><th>涨幅</th><th>连板</th><th>首封</th><th>末封</th><th>炸板</th><th>封单</th>
    </tr></thead>
    <tbody></tbody>
  </table></div>
  <div class="empty" id="zt-empty" hidden>暂无数据 —— 点右上角「立即归档今日数据」抓取</div>
</section>

<div class="grid cols-2">
  <section>
    <h2>行业资金流 · 主力净流入 TOP15 <small id="flow-i-date"></small></h2>
    <div class="tbl-wrap"><table id="flow-i">
      <thead><tr><th class="l">板块</th><th>涨跌幅</th><th>主力净流入</th><th>净占比</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <div class="empty" id="flow-i-empty" hidden>暂无数据</div>
  </section>
  <section>
    <h2>概念资金流 · 主力净流入 TOP15 <small id="flow-c-date"></small></h2>
    <div class="tbl-wrap"><table id="flow-c">
      <thead><tr><th class="l">板块</th><th>涨跌幅</th><th>主力净流入</th><th>净占比</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <div class="empty" id="flow-c-empty" hidden>暂无数据</div>
  </section>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

function fmtYi(v) {          // 元 → 亿,保留2位
  return (v / 1e8).toFixed(2);
}
function pctCell(p) {        // 涨跌幅:红涨绿跌 + 箭头冗余编码
  const cls = p > 0 ? "up" : (p < 0 ? "down" : "flat");
  const arrow = p > 0 ? "▲" : (p < 0 ? "▼" : "—");
  return `<span class="${cls}">${arrow} ${Math.abs(p).toFixed(2)}%</span>`;
}
function netCell(v) {        // 资金:流入红/流出绿 + 正负号冗余
  const cls = v > 0 ? "up" : (v < 0 ? "down" : "flat");
  const sign = v > 0 ? "+" : (v < 0 ? "-" : "");
  return `<span class="${cls}">${sign}${fmtYi(Math.abs(v))}<span class="sub">亿</span></span>`;
}

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.errors ? data.errors.join("; ") : r.status);
  return data;
}

async function loadStatus() {
  const s = await getJSON("/api/status");
  $("meta").textContent = "v" + s.version;
  return s.stats;
}

async function loadZt() {
  const d = await getJSON("/api/ztpool");
  $("zt-date").textContent = d.date || "";
  const tbody = $("zt-tbl").querySelector("tbody");
  tbody.innerHTML = "";
  $("zt-empty").hidden = d.items.length > 0;
  let maxBoards = 0;
  for (const it of d.items) {
    maxBoards = Math.max(maxBoards, it.boards);
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${it.code}</td><td class="l">${it.name}</td><td class="l">${it.industry}</td>` +
      `<td>${it.price.toFixed(2)}</td><td>${pctCell(it.pct)}</td>` +
      `<td><span class="boards-badge ${it.boards >= 3 ? "boards-hot" : ""}">${it.boards}板</span></td>` +
      `<td>${it.first_seal}</td><td>${it.last_seal}</td>` +
      `<td>${it.break_times || "—"}</td><td>${fmtYi(it.seal_fund)}<span class="sub">亿</span></td>`;
    tbody.appendChild(tr);
  }
  return { count: d.items.length, maxBoards };
}

async function loadFlow(kind, tblId, dateId, emptyId) {
  const d = await getJSON(`/api/sectorflow?kind=${kind}&limit=15`);
  $(dateId).textContent = d.date || "";
  const tbody = $(tblId).querySelector("tbody");
  tbody.innerHTML = "";
  $(emptyId).hidden = d.items.length > 0;
  for (const it of d.items) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td class="l">${it.name}</td><td>${pctCell(it.pct)}</td>` +
      `<td>${netCell(it.main_net)}</td><td>${it.main_pct.toFixed(2)}%</td>`;
    tbody.appendChild(tr);
  }
}

function renderTiles(stats, zt) {
  const tiles = [
    ["涨停家数", zt.count || "—", ""],
    ["最高连板", zt.maxBoards ? zt.maxBoards + " 板" : "—", ""],
    ["已归档交易日", stats.zt_days, "天"],
    ["最近归档", stats.last_archive ? stats.last_archive.slice(5, 16).replace("T", " ") : "从未", ""],
  ];
  $("tiles").innerHTML = tiles.map(([label, value, unit]) =>
    `<div class="tile"><div class="label">${label}</div>` +
    `<div class="value">${value} <small>${unit}</small></div></div>`).join("");
}

async function refresh() {
  try {
    $("msg").className = "";
    const stats = await loadStatus();
    const zt = await loadZt();
    await loadFlow("industry", "flow-i", "flow-i-date", "flow-i-empty");
    await loadFlow("concept", "flow-c", "flow-c-date", "flow-c-empty");
    renderTiles(stats, zt);
  } catch (e) {
    $("msg").textContent = "加载失败: " + e.message;
    $("msg").className = "err";
  }
}

$("archive-btn").addEventListener("click", async () => {
  const btn = $("archive-btn");
  btn.disabled = true;
  $("msg").textContent = "抓取中,约需十几秒…";
  $("msg").className = "";
  try {
    const r = await getJSON("/api/jobs/archive", { method: "POST" });
    $("msg").textContent = `归档完成: ${r.date} ` +
      Object.entries(r.steps).map(([k, v]) => `${k}=${v}`).join(" ");
    await refresh();
  } catch (e) {
    $("msg").textContent = "归档失败: " + e.message;
    $("msg").className = "err";
  } finally {
    btn.disabled = false;
  }
});

refresh();
</script>
</body>
</html>
